<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Markdown Editor</title>
  </head>
  <body>
    <main id="app" aria-label="Markdown editor">
      <section id="wysiwym" class="editor-surface is-hidden" aria-label="Rich Markdown editor"></section>
      <section id="source" class="editor-surface is-hidden" aria-label="Markdown source editor"></section>
      <article id="preview" class="markdown-body" aria-label="Markdown reading mode"></article>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
